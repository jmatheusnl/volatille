name: Deploy to AWS (S3 + CloudFront)

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::837749699431:role/github-actions-volatille-role
          aws-region: sa-east-1

      # Arquivos gerais.
<<<<<<< HEAD
      # index.html, products.json, assets, images e fonts são tratados separadamente.
=======
      # index.html, products.json, assets e images são tratados separadamente.
>>>>>>> 8ec99225f9ad199d92cdab5344c6049a19033c75
      - run: |
          aws s3 sync dist/ s3://volatille-loja \
            --delete \
            --exclude "video/*" \
            --exclude "index.html" \
            --exclude "products.json" \
            --exclude "assets/*" \
            --exclude "images/*" \
            --exclude "fonts/*"

      # index.html nunca deve ficar preso em cache.
      - run: |
          aws s3 cp dist/index.html s3://volatille-loja/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      # products.json pode ficar em cache por 5 minutos.
      - run: |
          aws s3 cp dist/products.json s3://volatille-loja/products.json \
            --cache-control "public, max-age=300" \
            --content-type "application/json"

      # Assets gerados pelo Vite possuem hash no nome.
      # Podem ficar em cache por 1 ano.
      - run: |
          aws s3 sync dist/assets/ s3://volatille-loja/assets/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      # Imagens podem ficar em cache por 1 ano.
      - run: |
          aws s3 sync dist/images/ s3://volatille-loja/images/ \
            --delete \
            --cache-control "public, max-age=31536000"

      # Fontes não mudam de nome entre builds — podem ficar em cache por 1 ano.
      - run: |
          aws s3 sync dist/fonts/ s3://volatille-loja/fonts/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      # O diretório video é preservado no bucket.

      # Garante que o CloudFront não mantenha versões antigas.
      - run: |
          aws cloudfront create-invalidation \
            --distribution-id E3S56ZN2YYH0Y \
            --paths "/*"