name: Deploy to AWS (S3 + CloudFront)

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::837749699431:role/github-actions-volatille-role
          aws-region: sa-east-1

      # Assets com nomes gerados pelo Vite podem ficar em cache por 1 ano.
      # index.html e products.json são tratados separadamente para não ficarem
      # presos em cache após um novo deploy.
      - run: |
          aws s3 sync dist/ s3://volatille-loja \
            --delete \
            --exclude "video/*" \
            --exclude "index.html" \
            --exclude "products.json" \
            --exclude "assets/*" \
            --exclude "images/*"

          aws s3 cp dist/index.html s3://volatille-loja/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

          aws s3 cp dist/products.json s3://volatille-loja/products.json \
            --cache-control "public, max-age=300" \
            --content-type "application/json"

          aws s3 cp dist/assets/ s3://volatille-loja/assets/ \
            --recursive \
            --cache-control "public, max-age=31536000, immutable"

          aws s3 cp dist/images/ s3://volatille-loja/images/ \
            --recursive \
            --cache-control "public, max-age=31536000"

      # Garante que o CloudFront não mantenha versões antigas após o deploy.
      - run: |
          aws cloudfront create-invalidation \
            --distribution-id E3S56ZN2YYH0Y \
            --paths "/*"